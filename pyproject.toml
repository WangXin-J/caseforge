[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caseforge"
version = "0.1.0"
description = "声明式接口用例执行引擎：YAML 描述用例，变量串联，失败自动归因"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
caseforge = "caseforge.cli:main"

[tool.setuptools]
packages = ["caseforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
